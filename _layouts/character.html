---
layout: default
---
<section class="section">
  <div class="container grid" style="grid-template-columns: .8fr 1.2fr; align-items:start; gap:2rem;">
    <div class="card">
      <img class="character-portrait" src="{{ page.image | relative_url }}" alt="{{ page.title }} concept portrait">
      <p class="meta">{{ page.species }}</p>
      <h1>{{ page.title }}</h1>
      <p class="muted">{{ page.role }}</p>
      <p class="placeholder-note">Concept portrait. Final production art may evolve as the brand style is refined.</p>
    </div>
    <div class="prose">
      <p class="eyebrow">Meet the crew</p>
      <h2 class="section-title">{{ page.title }}</h2>
      {{ content }}
      <p><a class="btn secondary" href="{{ '/characters/' | relative_url }}">Back to the crew</a></p>
    </div>
  </div>
</section>
