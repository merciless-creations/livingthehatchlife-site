title: "Living the Hatch Life™"
tagline: "Steinhatchee-inspired apparel, characters, stories, and coastal life."
description: "Living the Hatch Life™ is a Steinhatchee, Florida-inspired lifestyle brand celebrating fishing, scalloping, boating, family, friends, festivals, and original marine-animal mascots."
url: "https://livingthehatchlife.com"
baseurl: ""
email: "livingthehatchlife@gmail.com"
timezone: "America/New_York"
lang: "en-US"
logo: /assets/images/social-card.png
image: /assets/images/social-card.png

twitter:
  username: thehatchlife
  card: summary_large_image

brand:
  legal_name: "Merciless Creations LLC"
  name: "Living the Hatch Life™"
  alternate_name: "Hatch Life™"
  description: "A Steinhatchee-inspired lifestyle and apparel brand celebrating fishing, scalloping, boating, festival weekends, family, friends, and original marine-animal mascots."
  founding_location: "Steinhatchee, Florida"

analytics:
  google: "G-Q5JPEJJWCE"
  plausible_domain: ""
  cloudflare_token: ""

forms:
  launch_updates: "https://formspree.io/f/mgawbgjp"

permalink: /journal/:title/
excerpt_separator: "<!--more-->"

collections:
  characters:
    output: true
    permalink: /characters/:path/
  comics:
    output: true
    permalink: /comics/:path/
  products:
    output: true
    permalink: /shop/:path/
  places:
    output: true
    permalink: /places/:path/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  # jekyll-seo-tag reads og:image from page.image only and has no site-level
  # fallback, so without this default a page emits no og:image at all.
  # X caches image fetches per exact URL with no way to invalidate, so a failed
  # fetch sticks to the filename permanently. If a card ever shows text but no
  # image again, rename this file - regenerating it in place will not help.
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/social-card.png
        width: 1200
        height: 630
        alt: "Living the Hatch Life™ — Steinhatchee, Florida — with the five mascot characters"
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: characters
    values:
      layout: character
  - scope:
      path: ""
      type: comics
    values:
      layout: comic
  - scope:
      path: ""
      type: products
    values:
      layout: product
  - scope:
      path: ""
      type: places
    values:
      layout: page

exclude:
  - vendor/
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - README.md
