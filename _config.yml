title: "Living the Hatch Life™"
tagline: "Steinhatchee-inspired apparel, characters, stories, and coastal life."
description: "Living the Hatch Life™ is a Steinhatchee, Florida-inspired lifestyle brand celebrating fishing, scalloping, boating, family, friends, festivals, and original marine-animal mascots."
url: "https://livingthehatchlife.com"
baseurl: ""
email: "livingthehatchlife@gmail.com"
timezone: "America/New_York"
lang: "en-US"
logo: /assets/images/social-preview.svg
image: /assets/images/social-preview.svg

brand:
  legal_name: "Merciless Creations LLC"
  name: "Living the Hatch Life™"
  alternate_name: "Hatch Life™"
  description: "A Steinhatchee-inspired lifestyle and apparel brand celebrating fishing, scalloping, boating, festival weekends, family, friends, and original marine-animal mascots."
  founding_location: "Steinhatchee, Florida"

permalink: /journal/:title/
excerpt_separator: "<!--more-->"

collections:
  characters:
    output: true
    permalink: /characters/:path/
  products:
    output: true
    permalink: /shop/:path/
  places:
    output: true
    permalink: /places/:path/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: characters
    values:
      layout: character
  - scope:
      path: ""
      type: products
    values:
      layout: product
  - scope:
      path: ""
      type: places
    values:
      layout: page

exclude:
  - vendor/
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - README.md
